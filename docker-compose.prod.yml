# Production stack: frontend + backend (with conversion/OCR tools) + Caddy (auto-HTTPS).
# Set DOMAIN in a .env file next to this one, then:  docker compose -f docker-compose.prod.yml up -d --build
#
#   echo "DOMAIN=yourdomain.com" > .env
#
# DNS: point both  yourdomain.com  and  api.yourdomain.com  (A/AAAA) at this server's IP.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.full        # includes LibreOffice + Tesseract
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      CORS_ALLOW_ORIGINS: "https://${DOMAIN}"
      DATA_DIR: /data
      RATE_LIMIT_REQUESTS: "60"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      # Backend only sees Caddy's IP, so trust Caddy's X-Forwarded-For to rate-limit
      # per real client. Safe here because the backend is internal-only (not exposed).
      TRUST_FORWARDED_FOR: "true"
      OFFICE_TIMEOUT_SECONDS: "180"
      # Usage metrics persist outside the ephemeral tmpfs so they survive restarts.
      METRICS_DB_PATH: /metrics/metrics.db
      # Admin dashboard at https://api.DOMAIN/admin. Set these in the .env next to this
      # file (ADMIN_USER / ADMIN_PASSWORD); leave ADMIN_PASSWORD empty to disable it.
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /data            # user files — RAM-backed, wiped on restart (never persisted)
      - /tmp
    volumes:
      - metrics_data:/metrics   # aggregate usage counts only — persistent
    mem_limit: 2g
    cpus: "2.0"
    expose:
      - "8000"            # internal only; Caddy reaches it over the compose network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time -> must be the PUBLIC api URL.
        NEXT_PUBLIC_API_BASE_URL: "https://api.${DOMAIN}"
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2.8
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"       # HTTP/3
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  metrics_data:
